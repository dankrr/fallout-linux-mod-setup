name: shellcheck

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash -n fallout-linux-mod-setup.sh
      - run: shellcheck fallout-linux-mod-setup.sh
